doctrine_migrations:
    migrations_paths:
        # namespace is arbitrary but should be different from App\Migrations
        # as migrations classes should NOT be autoloaded
        'DoctrineMigrations': '%kernel.project_dir%/migrations'
    enable_profiler: false
    # MariaDB commits implicitly on every DDL statement (CREATE/ALTER/DROP),
    # so wrapping schema migrations in a transaction doesn't make them atomic;
    # Doctrine just warns that the transaction was already committed. With
    # this, newly generated migrations get an isTransactional() returning false
    # (it doesn't change existing ones). A data-only migration (INSERT/UPDATE/
    # DELETE, no DDL) should return true there instead.
    transactional: false
